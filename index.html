<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua & Snowden | Strictly By Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #AA8C2C;
            --black: #0A0A0A;
            --dark-gray: #141414;
            --card-bg: rgba(20, 20, 20, 0.85);
            --white: #F9F9F9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            min-height: 100vh;
        }

        h1, h2, h3, .gold-text {
            font-family: 'Cinzel', serif;
            color: var(--gold);
        }

        /* Background Animation Overlay */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 0.6; }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* Strict Notice */
        .strict-badge {
            display: inline-block;
            border: 1px solid var(--gold);
            padding: 8px 24px;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 30px;
            background: rgba(212, 175, 55, 0.05);
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1s 0.3s forwards;
        }

        /* Header / Hero */
        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 1s 0.6s forwards;
        }

        .subtitle {
            font-size: 1.1rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s 0.9s forwards;
        }

        /* Kingsman Image Banner */
        .image-banner {
            width: 100%;
            height: 350px;
            background: linear-gradient(to bottom, rgba(10,10,10,0.2), var(--black)), 
                        url('https://images.unsplash.com/photo-1594938298603-c8148c4dae35?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
            border: 2px solid var(--gold);
            border-radius: 4px;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            opacity: 0;
            transform: scale(0.95);
            animation: scaleUp 1s 1.2s forwards;
            position: relative;
        }

        .image-banner::after {
            content: "Manners Maketh Man";
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            font-family: 'Cinzel', serif;
            font-style: italic;
            color: var(--gold-light);
            letter-spacing: 2px;
            font-size: 0.9rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Details Card */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 40px;
            margin-bottom: 40px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s 1.5s forwards;
        }

        .event-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .info-item h3 {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--gold-dark);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .info-item p {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .fee-highlight {
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 25px;
            margin-top: 25px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .fee-highlight span {
            color: var(--gold);
            font-weight: 700;
        }

        /* RSVP Form */
        .rsvp-section {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 40px;
            border-radius: 6px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s 1.8s forwards;
        }

        .rsvp-section h2 {
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--gold);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: var(--black);
            border: 1px solid #333;
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            color: var(--black);
            border: none;
            padding: 15px 30px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 1s 2.1s forwards;
        }

        /* Keyframe Animations */
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes fadeInDown {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleUp {
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.2rem; }
            .container { padding: 20px 10px; }
            .card, .rsvp-section { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Floating Gold Particles Background -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- Strict Notice -->
        <div class="strict-badge">Strictly By Invitation</div>

        <!-- Header -->
        <header>
            <h1>Joshua & Snowden</h1>
            <div class="subtitle">Joint Birthday Celebration</div>
        </header>

        <!-- Kingsman Banner Image -->
        <div class="image-banner"></div>

        <!-- Event Details Card -->
        <div class="card">
            <div class="event-info">
                <div class="info-item">
                    <h3>Date</h3>
                    <p>18th November</p>
                </div>
                <div class="info-item">
                    <h3>Dress Code</h3>
                    <p> Suits</p>
                </div>
            </div>
            <div class="fee-highlight">
                Investment Fee: <span>₹2000</span>
            </div>
        </div>

        <!-- RSVP Form -->
        <div class="rsvp-section">
            <h2>RSVP Intent</h2>
            <form id="whatsappForm" onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="guests">Number of Attendees</label>
                    <select id="guests" class="form-control">
                        <option value="1">1 Person</option>
                        <option value="2">2 Persons</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Confirm Via WhatsApp</button>
            </form>
        </div>

        <footer>
            &copy; 2026 The Kingsmen Celebration. All Rights Reserved.
        </footer>
    </div>

    <script>
        // Generate dynamic background particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random styling
            const size = Math.random() * 4 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${Math.random() * 6 + 4}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;

            particlesContainer.appendChild(particle);
        }

        // WhatsApp Form Redirect Handler
        function sendToWhatsApp(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const guests = document.getElementById('guests').value;
            
            // REPLACE THIS WITH YOUR ACTUAL WHATSAPP NUMBER (with country code, e.g., 919876543210)
            const phoneNumber = "YOUR_PHONE_NUMBER"; 

            const message = `*RSVP - Joshua & Snowden Birthday*%0A%0A*Name:* ${name}%0A*Guests:* ${guests}%0A*Investment Fee Confirmed:* ₹2000%0A*Status:* Attending`;

            const whatsappURL = `https://wa.me/${+263711389424}?text=${message}`;
            
            window.open(whatsappURL, '_blank');
        }
    </script>
</body>
</html>
